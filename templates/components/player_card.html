<div class="col-xl-4 col-lg-6 col-md-6 mb-3">

    <a
        href="{{ url_for('player', player_id=player.id) }}"
        class="text-decoration-none text-reset"
    >

        <div class="card player-card shadow-sm">

            <div class="card-body">

                <div class="d-flex align-items-center">

                    <img
                        src="{{ url_for('static', filename='img/teams/' ~ player.team_info.logo) }}"
                        class="player-card-logo me-3"
                        alt="{{ player.team }}"
                    >

                    <div class="flex-grow-1">

                        <div class="player-card-name">

                            {{ player.name }}

                        </div>

                        <div class="text-secondary small mb-2">

                            {{ player.team }}

                        </div>

                        <div class="d-flex flex-wrap gap-2">

                            {% if player.role == "P" %}
                                <span class="badge bg-primary">🧤 Brankář</span>
                            {% elif player.role == "D" %}
                                <span class="badge bg-success">🛡️ Obránce</span>
                            {% elif player.role == "C" %}
                                <span class="badge bg-warning text-dark">🎯 Záložník</span>
                            {% elif player.role == "A" %}
                                <span class="badge bg-danger">⚽ Útočník</span>
                            {% endif %}

                            <span class="badge bg-light text-dark">
                                💰 {{ player.buy_price }}
                            </span>

                            <span class="badge bg-info text-dark">
                                📈 {{ player.qa }}
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </a>

</div>
